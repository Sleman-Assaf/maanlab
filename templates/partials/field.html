{% comment %} Accessible form field. Params: field, css {% endcomment %}
<div class="field{% if field.errors %} has-error{% endif %}{% if css %} {{ css }}{% endif %}">
  <label class="field__label" for="{{ field.id_for_label }}">
    {{ field.label }}{% if field.field.required %}<span class="field__req" aria-hidden="true"> *</span>{% endif %}
  </label>
  {{ field }}
  {% if field.errors %}<p class="field__error" id="{{ field.auto_id }}-error">{{ field.errors|first }}</p>{% endif %}
</div>
