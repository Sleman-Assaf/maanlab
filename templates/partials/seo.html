{% load static i18n %}
<link rel="canonical" href="{{ CANONICAL_URL }}">
<link rel="alternate" hreflang="en" href="{{ SITE_URL }}{{ ALT_URLS.en }}">
<link rel="alternate" hreflang="ar" href="{{ SITE_URL }}{{ ALT_URLS.ar }}">
<link rel="alternate" hreflang="x-default" href="{{ SITE_URL }}{{ ALT_URLS.en }}">

<meta property="og:site_name" content="MAAN LAB">
<meta property="og:type" content="{{ og_type|default:'website' }}">
<meta property="og:title" content="{{ page_title|default:'MAAN LAB' }}">
<meta property="og:description" content="{{ page_description|default:'' }}">
<meta property="og:url" content="{{ CANONICAL_URL }}">
<meta property="og:locale" content="{{ OG_LOCALE }}">
<meta property="og:locale:alternate" content="{% if LANG == 'ar' %}en_US{% else %}ar_JO{% endif %}">
{% if og_image %}
<meta property="og:image" content="{{ SITE_URL }}{{ og_image }}">
{% else %}
<meta property="og:image" content="{{ SITE_URL }}{% static 'img/brand/og-default.jpg' %}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
{% endif %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page_title|default:'MAAN LAB' }}">
<meta name="twitter:description" content="{{ page_description|default:'' }}">
<meta name="twitter:image" content="{{ SITE_URL }}{% if og_image %}{{ og_image }}{% else %}{% static 'img/brand/og-default.jpg' %}{% endif %}">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "MAAN LAB",
  "url": "{{ SITE_URL }}/{{ LANG }}/",
  "logo": "{{ SITE_URL }}{% static 'img/brand/apple-touch-icon.png' %}",
  "email": "{{ CONTACT_EMAIL }}",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Ma'an",
    "addressCountry": "JO"
  },
  "sameAs": ["{{ SOCIAL_LINKS.instagram }}", "{{ SOCIAL_LINKS.facebook }}", "{{ SOCIAL_LINKS.linkedin }}"]
}
</script>
