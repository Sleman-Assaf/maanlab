<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid meet">
  <!-- PLACEHOLDER visual — Digital Transformation (scattered sheets → one operational view) -->
  <defs>
    <radialGradient id="bg" gradientUnits="userSpaceOnUse" gradientTransform="matrix(1200 0 0 900 0 0)" cx="0.6" cy="0.5" r="0.8">
      <stop offset="0" stop-color="#1e1a16"/>
      <stop offset="1" stop-color="#0c0b0a"/>
    </radialGradient>
    <style>
      .sheet{fill:#141210;stroke:#c9b79c;stroke-opacity:.22}
      .row{fill:#c9b79c;fill-opacity:.16}
      .panel{fill:#151311;stroke:#c9b79c;stroke-opacity:.28}
      .flow{fill:none;stroke:#dd6b2f;stroke-width:1.4;stroke-dasharray:4 9;animation:flow 1.8s linear infinite}
      .draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 4s ease-out infinite}
      @keyframes flow{to{stroke-dashoffset:-26}}
      @keyframes draw{60%,100%{stroke-dashoffset:0}}
      @media (prefers-reduced-motion: reduce){.flow{animation:none}.draw{animation:none;stroke-dashoffset:0}}
    </style>
  </defs>
  <rect x="-1200" y="-900" width="3600" height="2700" fill="url(#bg)"/>

  <!-- Scattered sheets (before) -->
  <g opacity=".85">
    <g transform="translate(90 190) rotate(-8)"><rect class="sheet" width="190" height="130" rx="10"/><rect class="row" x="16" y="20" width="120" height="8" rx="4"/><rect class="row" x="16" y="40" width="150" height="8" rx="4"/><rect class="row" x="16" y="60" width="90" height="8" rx="4"/><rect class="row" x="16" y="80" width="140" height="8" rx="4"/></g>
    <g transform="translate(150 380) rotate(6)"><rect class="sheet" width="190" height="130" rx="10"/><rect class="row" x="16" y="20" width="100" height="8" rx="4"/><rect class="row" x="16" y="40" width="150" height="8" rx="4"/><rect x="16" y="60" width="60" height="8" rx="4" fill="#dd6b2f" fill-opacity=".7"/><rect class="row" x="16" y="80" width="120" height="8" rx="4"/></g>
    <g transform="translate(70 580) rotate(-3)"><rect class="sheet" width="190" height="130" rx="10"/><rect class="row" x="16" y="20" width="140" height="8" rx="4"/><rect class="row" x="16" y="40" width="80" height="8" rx="4"/><rect class="row" x="16" y="60" width="150" height="8" rx="4"/><rect class="row" x="16" y="80" width="110" height="8" rx="4"/></g>
  </g>

  <!-- Flows into the system -->
  <path class="flow" d="M290 250 C 420 260, 420 420, 520 440"/>
  <path class="flow" d="M340 450 C 420 450, 440 450, 520 450"/>
  <path class="flow" d="M270 640 C 420 640, 420 470, 520 460"/>

  <!-- Dashboard (after) -->
  <g transform="translate(520 170)">
    <rect class="panel" width="600" height="560" rx="20"/>
    <rect x="32" y="30" width="140" height="10" rx="5" fill="#f2eee7" fill-opacity=".75"/>
    <rect x="32" y="50" width="90" height="8" rx="4" class="row"/>
    <!-- KPI tiles -->
    <rect x="32" y="90" width="168" height="96" rx="12" fill="#1b1815"/>
    <rect x="216" y="90" width="168" height="96" rx="12" fill="#1b1815"/>
    <rect x="400" y="90" width="168" height="96" rx="12" fill="#1b1815"/>
    <rect x="52" y="110" width="60" height="8" rx="4" class="row"/>
    <rect x="52" y="136" width="90" height="26" rx="4" fill="#f2eee7" fill-opacity=".85"/>
    <rect x="236" y="110" width="60" height="8" rx="4" class="row"/>
    <rect x="236" y="136" width="70" height="26" rx="4" fill="#dd6b2f"/>
    <rect x="420" y="110" width="60" height="8" rx="4" class="row"/>
    <rect x="420" y="136" width="100" height="26" rx="4" fill="#f2eee7" fill-opacity=".85"/>
    <!-- chart -->
    <rect x="32" y="208" width="536" height="220" rx="12" fill="#1b1815"/>
    <path d="M52 390 H548" stroke="#c9b79c" stroke-opacity=".15"/>
    <path d="M52 330 H548" stroke="#c9b79c" stroke-opacity=".08"/>
    <path d="M52 270 H548" stroke="#c9b79c" stroke-opacity=".08"/>
    <path class="draw" d="M52 380 C 110 370, 140 330, 190 336 S 280 300, 320 290 S 420 240, 460 250 S 520 226, 548 232" fill="none" stroke="#dd6b2f" stroke-width="2.4"/>
    <!-- table -->
    <rect x="32" y="450" width="536" height="22" rx="6" class="row"/>
    <rect x="32" y="482" width="536" height="22" rx="6" fill="#c9b79c" fill-opacity=".07"/>
    <rect x="32" y="514" width="536" height="22" rx="6" fill="#c9b79c" fill-opacity=".07"/>
    <circle cx="540" cy="493" r="5" fill="#dd6b2f"/>
  </g>
</svg>
